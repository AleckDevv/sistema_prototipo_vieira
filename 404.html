<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada · Vieira | Gestão Operacional</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <script src="/js/tema-inicial.js"></script>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --border: #e4e7ec;
        --text: #1f2933;
        --muted: #667085;
        --marca: #1d3a5f;
        --botao: #1d3a5f;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #0e1520;
        --surface: #151e2b;
        --border: #263345;
        --text: #e4e9ef;
        --muted: #8b98a9;
        --marca: #8fb4e3;
        --botao: #3a679f;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 460px;
        padding: 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        text-align: center;
      }
      .marca {
        margin: 0 0 18px;
        font-weight: 700;
        color: var(--marca);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 9px 16px;
        border-radius: 6px;
        background: var(--botao);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="marca">Vieira | Gestão Operacional</p>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe nesta demonstração.</p>
      <a href="/">Ir para o Dashboard</a>
    </main>
  </body>
</html>
